# AgentShield passive-scan lab (M1). Not started automatically.
# Two static nginx sites bound to loopback only: a well-configured one on
# 127.0.0.1:8081 and a deliberately misconfigured one on 127.0.0.1:8082.
# Starting it downloads the nginx image once (network access) and requires
# Docker; see README.md in this folder before running anything.
services:
  lab-good:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx/good.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site:/usr/share/nginx/html:ro
      - ./security:/usr/share/nginx/security:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
  lab-bad:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./nginx/bad.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site:/usr/share/nginx/html:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
