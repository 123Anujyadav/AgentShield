# Well-configured lab site (expected: no findings except those that do not
# apply to plain HTTP; see ../README.md).
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Set-Cookie "lab_session=demo; Path=/; HttpOnly; SameSite=Lax" always;

    location = /.well-known/security.txt {
        default_type text/plain;
        alias /usr/share/nginx/security/security.txt;
    }
}
