# Deliberately misconfigured lab site. Every header here is a known weakness
# the passive checks should report; see ../README.md for the expected list.
server {
    listen 80;
    server_name _;
    server_tokens on;
    root /usr/share/nginx/html;

    add_header X-Powered-By "PHP/7.4.3" always;
    add_header Content-Security-Policy "default-src * 'unsafe-inline'" always;
    add_header X-Frame-Options "ALLOW-FROM https://example.com" always;
    add_header Referrer-Policy "unsafe-url" always;
    add_header Permissions-Policy "camera 'none'" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Set-Cookie "lab_session=demo; Path=/" always;

    location = /.well-known/security.txt {
        return 404;
    }
}
